ktor:
  deployment:
    port: 8080
  application:
    modules:
      - de.fraunhofer.aisec.glue.ApplicationKt.module
connector:
  identity: "https://glue-connector.local"
  publicUrl: "${?PUBLIC_URL}"
  publicDomain: "${?PUBLIC_DOMAIN}"
atls:
  enabled: false
  cmcAddress: "unix:/tmp/cmcd.sock"
  caCertPath: "/pki/ca-cert.pem"
docker:
  envoyNetworkName: "${?ENVOY_NETWORK_NAME}"
  sniProxyPort: 8444
  pipelineEntryPort: 8080
